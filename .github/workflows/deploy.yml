name: Test and Deploy EmpEval
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
      - run: node --experimental-strip-types --test tests/domain-v1.2.test.mjs tests/workbook-v1.2.test.mjs tests/sheets-v1.2.test.mjs
      - run: npm run build
        env:
          VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}
          VITE_SPREADSHEET_ID: ${{ vars.VITE_SPREADSHEET_ID }}
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - run: node tests/smoke.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: empeval-dist
          path: dist
  deploy:
    if: github.event_name != 'pull_request'
    needs: test
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: empeval-dist
          path: dist
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
